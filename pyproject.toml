[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scarlettmix"
version = "0.1.0"
description = "Mixer and routing control for first-generation Focusrite Scarlett interfaces on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6"]

[project.gui-scripts]
scarlettmix = "scarlettmix.__main__:main"

[tool.setuptools]
packages = ["scarlettmix", "scarlettmix.ui"]

[tool.setuptools.package-data]
scarlettmix = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
